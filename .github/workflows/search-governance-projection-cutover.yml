name: Search Governance Projection Cutover

on:
  push:
    branches:
      - phase2/search-governance-lifecycle-projection
    paths:
      - "scripts/apply-search-governance-projection.mjs"
      - ".github/workflows/search-governance-projection-cutover.yml"

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase2/search-governance-lifecycle-projection
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Apply Search Governance projection cutover
        run: node scripts/apply-search-governance-projection.mjs
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/review/route.ts app/ui/admin/OperationsController.tsx
          git commit -m "feat(governance): consume Search lifecycle projection end-to-end"
          git push origin HEAD:phase2/search-governance-lifecycle-projection
