name: Coffee Platform CI/CD

run-name: Coffee Platform · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - main
      - "phase5/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the verified Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Reject generated source changes
        run: git diff --exit-code

      - name: Upload auditable Next.js build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coffee-platform-next-${{ github.sha }}
          path: |
            .next/**
            !.next/cache/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 9
