name: Coffee Platform CI/CD

run-name: Coffee Platform · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - main
      - "phase5/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_beta:
        description: Deploy this revision to the Baghdad beta Worker
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use the verified Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Validate deployment package
        run: npm run deploy:dry-run

      - name: Reject generated source changes
        run: git diff --exit-code

      - name: Upload immutable Worker artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coffee-platform-worker-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 9

  deploy-beta:
    name: Deploy Baghdad beta
    needs: quality
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_beta)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: baghdad-beta
      cancel-in-progress: false
    environment:
      name: baghdad-beta
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use the verified Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0

      - name: Download the tested Worker artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: coffee-platform-worker-${{ github.sha }}
          path: dist/

      - name: Validate protected deployment settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for setting in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!setting:-}" ]; then
              echo "Missing required baghdad-beta secret: ${setting}" >&2
              exit 78
            fi
          done

      - name: Deploy the tested artifact
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.92.0
          command: >-
            deploy --config wrangler.deploy.jsonc --strict
            --message "GitHub ${{ github.sha }}"
          secrets: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
