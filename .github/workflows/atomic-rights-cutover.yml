name: Atomic Rights Cutover

on:
  push:
    branches:
      - phase5/atomic-rights-boundary
    paths:
      - "scripts/route-rights-through-atomic-rpc.mjs"
      - ".github/workflows/atomic-rights-cutover.yml"

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase5/atomic-rights-boundary
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Apply atomic rights cutover
        run: node scripts/route-rights-through-atomic-rpc.mjs
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/review/route.ts
          git commit -m "feat(governance): route rights through atomic RPC"
          git push origin HEAD:phase5/atomic-rights-boundary
