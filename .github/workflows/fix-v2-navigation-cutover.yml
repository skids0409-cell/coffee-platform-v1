name: One-shot V2 Navigation Cutover Fix
on:
  push:
    branches: [hotfix/isolate-legacy-operations-shell]
    paths: [scripts/fix-v2-navigation-cutover.mjs]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hotfix/isolate-legacy-operations-shell
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: node scripts/fix-v2-navigation-cutover.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/admin/data-center-v2/DataCenterV2App.tsx tests/operations-dedicated-route-cutover.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(data-center-v2): keep primary navigation inside V2"
          git push origin HEAD:hotfix/isolate-legacy-operations-shell
