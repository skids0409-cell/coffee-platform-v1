name: Dependency Audit Baseline

on:
  push:
    branches:
      - hardening/dependency-security-audit
    paths:
      - ".github/workflows/dependency-audit-baseline.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --include=dev
      - name: Exact npm audit JSON
        shell: bash
        run: |
          set +e
          npm audit --json | tee npm-audit-baseline.json
          echo "audit_exit=${PIPESTATUS[0]}" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-audit-baseline
          path: npm-audit-baseline.json
          if-no-files-found: error
