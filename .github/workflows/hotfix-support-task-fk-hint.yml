name: Hotfix Support Task FK Hint

on:
  push:
    branches:
      - hotfix/postgrest-support-task-fk-hint

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hotfix/postgrest-support-task-fk-hint
      - name: Apply exact PostgREST FK hint
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/admin/review/route.ts')
          text = path.read_text()
          old = 'technical_task:technical_tasks(id,task_code,title,status)'
          new = 'technical_task:technical_tasks!support_requests_technical_task_id_fkey(id,task_code,title,status)'
          if old not in text:
              raise SystemExit('expected relation selector not found')
          text = text.replace(old, new, 1)
          if old in text:
              raise SystemExit('unexpected duplicate unresolved relation selector')
          path.write_text(text)
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-support-task-fk-hint.yml
          git add app/api/admin/review/route.ts
          git commit -m 'fix(review): disambiguate support technical-task relation'
          git push origin HEAD:hotfix/postgrest-support-task-fk-hint
