name: Rendered HTML Test Realignment

on:
  push:
    branches:
      - phase6/operations-remediation-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase6/operations-remediation-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: node scripts/apply-rendered-html-realignment.mjs
      - name: Commit stale-test realignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rendered-html.test.mjs
          git diff --cached --quiet || git commit -m "test(remediation): realign rendered assertions to dedicated workspaces"
          git push origin HEAD:phase6/operations-remediation-v1
