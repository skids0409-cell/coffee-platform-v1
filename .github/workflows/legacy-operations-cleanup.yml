name: One-time legacy Operations cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/legacy-operations-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 1

      - name: Use verified Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Remove legacy Operations block with guarded codemod
        run: node scripts/remove-legacy-operations.mjs

      - name: Verify no legacy Operations residue remains
        run: |
          ! grep -q 'type DataCenterBatch = {' app/ui/Platform.tsx
          ! grep -q 'function Operations()' app/ui/Platform.tsx
          ! grep -q 'operations-workspace-nav' app/ui/Platform.tsx
          grep -q 'const betaTestTasks = \[' app/ui/Platform.tsx
          grep -q 'function HelpSupport()' app/ui/Platform.tsx
          grep -q 'export default function Platform' app/ui/Platform.tsx

      - name: Lint cleaned source
        run: npm run lint

      - name: Test and build cleaned source
        run: npm test

      - name: Remove one-time cleanup machinery
        run: git rm scripts/remove-legacy-operations.mjs .github/workflows/legacy-operations-cleanup.yml

      - name: Commit physical legacy removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/Platform.tsx
          git commit -m "refactor(platform): physically remove legacy operations monolith"
          git push origin HEAD:main
