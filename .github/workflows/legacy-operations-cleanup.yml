name: Phase 1 validation

on:
  push:
    branches:
      - phase1/legacy-operations-cleanup
    paths:
      - ".github/workflows/legacy-operations-cleanup.yml"
      - "app/ui/Platform.tsx"
      - "app/ui/partner/PartnerPortal.tsx"
      - "app/ui/admin/**"
      - "app/api/admin/review/route.ts"
      - "supabase/migrations/**"
      - "tests/**"

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase1/legacy-operations-cleanup
          fetch-depth: 1

      - name: Use verified Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Verify phase 1 boundaries
        run: |
          ! grep -q 'type DataCenterBatch = {' app/ui/Platform.tsx
          ! grep -q 'function Operations()' app/ui/Platform.tsx
          ! grep -q 'operations-workspace-nav' app/ui/Platform.tsx
          ! grep -q 'PartnerReviewQueue' app/ui/Platform.tsx
          grep -q 'PartnerPortal' app/ui/Platform.tsx
          grep -q 'export function PartnerPortal()' app/ui/partner/PartnerPortal.tsx
          grep -q 'else if (page.kind === "partner") body = <PartnerPortal />;' app/ui/Platform.tsx
          ! grep -q 'aria-description' app/ui/admin/OperationsWorkspaceShell.tsx
          ! grep -q 'window.prompt' app/ui/admin/ReviewWorkspace.tsx
          ! grep -q 'window.confirm' app/ui/admin/ReviewWorkspace.tsx
          grep -q 'StandardConfirmDialog' app/ui/admin/OperationsController.tsx
          grep -q 'rpc/admin_transition_review_record' app/api/admin/review/route.ts

      - name: Lint with captured diagnostics
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint > ci-lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat ci-lint.log
          exit 0

      - name: Persist lint diagnostics on failure
        if: steps.lint.outputs.exit_code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-lint.log
          git commit -m "ci: capture phase1 lint diagnostics" || true
          git push origin HEAD:phase1/legacy-operations-cleanup
          exit 1

      - name: Build
        run: npm run build

      - name: Tests
        run: node --test tests/*.test.mjs
