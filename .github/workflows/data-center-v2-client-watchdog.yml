name: Data Center V2 Client Parity Watchdog
on:
  push:
    branches: [phase6/data-center-v2-rebuild]
    paths: [scripts/apply-data-center-v2-client-watchdog.mjs]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase6/data-center-v2-rebuild
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: node scripts/apply-data-center-v2-client-watchdog.mjs
      - name: Commit watchdog cutover
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/ui/admin/data-center-v2/DataCenterV2App.tsx
          git diff --cached --quiet || git commit -m "feat(data-center-v2): add continuous client parity watchdog"
          git push
