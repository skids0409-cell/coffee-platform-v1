name: Dependency Remediation

on:
  push:
    branches:
      - hardening/dependency-security-audit
    paths:
      - ".github/workflows/dependency-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hardening/dependency-security-audit
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --include=dev
      - name: Upgrade patched framework line and safe transitive fixes
        run: |
          npm install --save-exact next@16.3.4 eslint-config-next@16.3.4
          npm audit fix
      - name: Require zero audit findings
        shell: bash
        run: |
          npm audit --json > npm-audit-final.json
          node -e 'const r=require("./npm-audit-final.json"); if(r.metadata.vulnerabilities.total!==0){console.error(JSON.stringify(r.vulnerabilities,null,2)); process.exit(1)}; console.log("audit_total=0")'
      - name: Commit dependency-only remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): remediate dependency advisories"
          git push origin HEAD:hardening/dependency-security-audit
