name: Data Import UI Finalize

on:
  push:
    branches:
      - phase2/data-import-lifecycle-projection
    paths:
      - "scripts/finalize-data-import-projection.mjs"
      - ".github/workflows/data-import-ui-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase2/data-import-lifecycle-projection
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Finalize Data Import lifecycle UI
        run: node scripts/finalize-data-import-projection.mjs
      - name: Commit lifecycle UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/admin/DataCenterWorkspace.tsx app/ui/admin/ArchivedImportBatches.tsx
          git commit -m "feat(governance): consume Data Import lifecycle projection in UI"
          git push origin HEAD:phase2/data-import-lifecycle-projection
