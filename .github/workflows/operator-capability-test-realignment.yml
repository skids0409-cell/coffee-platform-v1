name: Operator Capability Test Realignment

on:
  push:
    branches:
      - phase2/operator-capabilities-projection
    paths:
      - "scripts/realign-taxonomy-capability-test.mjs"
      - ".github/workflows/operator-capability-test-realignment.yml"

permissions:
  contents: write

jobs:
  realign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase2/operator-capabilities-projection
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Realign taxonomy capability assertion
        run: node scripts/realign-taxonomy-capability-test.mjs
      - name: Commit test realignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rendered-html.test.mjs
          git commit -m "test(governance): align taxonomy gate with operator capabilities"
          git push origin HEAD:phase2/operator-capabilities-projection
