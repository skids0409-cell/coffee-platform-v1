name: Platform Conformance Diagnostic

on:
  push:
    branches:
      - phase6/platform-conformance-report
    paths:
      - ".github/workflows/platform-conformance-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase6/platform-conformance-report
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Capture test/build output
        shell: bash
        run: |
          set +e
          npm test > ci-platform-conformance.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> ci-platform-conformance.log
          exit 0
      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-platform-conformance.log
          git commit -m "ci: capture remaining platform conformance diagnostics"
          git push origin HEAD:phase6/platform-conformance-report
