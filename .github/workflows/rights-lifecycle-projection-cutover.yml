name: Rights Lifecycle Projection Cutover

on:
  push:
    branches:
      - phase2/rights-lifecycle-projection
    paths:
      - "scripts/apply-rights-lifecycle-projection.mjs"
      - ".github/workflows/rights-lifecycle-projection-cutover.yml"

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase2/rights-lifecycle-projection
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Apply Rights lifecycle projection
        run: node scripts/apply-rights-lifecycle-projection.mjs
      - name: Commit projection cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/review/route.ts
          git commit -m "feat(governance): project Rights lifecycle actions on server"
          git push origin HEAD:phase2/rights-lifecycle-projection
