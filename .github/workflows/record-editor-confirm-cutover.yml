name: Record Editor Confirm Cutover

on:
  push:
    branches:
      - phase6/final-platform-conformance
    paths:
      - "scripts/replace-record-editor-browser-confirm.mjs"
      - ".github/workflows/record-editor-confirm-cutover.yml"

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase6/final-platform-conformance
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Apply governed confirmation cutover
        run: node scripts/replace-record-editor-browser-confirm.mjs
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/admin/useReviewRecordEditorController.ts app/ui/admin/ReviewRecordEditor.tsx
          git commit -m "fix(governance): remove final record editor browser confirms"
          git push origin HEAD:phase6/final-platform-conformance
