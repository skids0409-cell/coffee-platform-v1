name: One-shot V2 Operations Link Fix
on:
  push:
    branches: [hotfix/data-center-v2-root-cutover]
    paths: [scripts/fix-v2-operations-links.mjs]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hotfix/data-center-v2-root-cutover
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: node scripts/fix-v2-operations-links.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/admin/data-center-v2/DataCenterV2App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(data-center-v2): keep login and operations links off root redirect"
          git push origin HEAD:hotfix/data-center-v2-root-cutover
