name: Final Conformance Cutover

on:
  push:
    branches:
      - phase6/final-platform-conformance
    paths:
      - "scripts/apply-final-conformance-cutover.mjs"
      - ".github/workflows/final-conformance-cutover.yml"

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase6/final-platform-conformance
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Apply final conformance cutover
        run: node scripts/apply-final-conformance-cutover.mjs
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/media-vault/route.ts app/api/admin/preservation/route.ts app/ui/admin/MediaVaultWorkspace.tsx app/ui/admin/governance/MediaPreservationProjection.tsx
          git commit -m "feat(governance): eliminate media client action inference and browser prompts"
          git push origin HEAD:phase6/final-platform-conformance
