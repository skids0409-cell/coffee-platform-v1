name: Search Weak Query Intake

on:
  push:
    branches:
      - phase6/operations-remediation-v1
    paths:
      - ".github/workflows/search-weak-query-intake.yml"

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase6/operations-remediation-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: node scripts/apply-search-weak-query-intake.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/admin/SearchGovernanceWorkspace.tsx app/ui/admin/OperationsController.tsx
          git commit -m "feat(remediation): govern weak search query intake"
          git push origin HEAD:phase6/operations-remediation-v1
