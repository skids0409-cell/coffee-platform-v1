name: One-shot Data Center V2 UX Conformance
on:
  push:
    branches: [hotfix/data-center-v2-ux-conformance]
    paths:
      - scripts/apply-v2-ux-conformance.mjs
      - .github/workflows/apply-v2-ux-conformance.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: hotfix/data-center-v2-ux-conformance
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: node scripts/apply-v2-ux-conformance.mjs
      - name: Commit UX conformance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git diff --cached --quiet && exit 0
          git commit -m "fix(data-center-v2): Arabic-first specialist UX conformance"
          git push origin HEAD:hotfix/data-center-v2-ux-conformance
