name: Operations Resolver Cutover

on:
  push:
    branches:
      - phase6/operations-remediation-v1
    paths:
      - ".github/workflows/operations-resolver-cutover.yml"

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase6/operations-remediation-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: node scripts/apply-operations-resolver-cutover.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/admin/PendingAssetReviewConsole.tsx app/api/admin/media-vault/review/route.ts
          git commit -m "feat(remediation): cut over pending asset review to entity resolver"
          git push origin HEAD:phase6/operations-remediation-v1
