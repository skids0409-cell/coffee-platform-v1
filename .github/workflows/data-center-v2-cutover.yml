name: Data Center V2 Cutover
on:
  push:
    branches: [phase6/data-center-v2-cutover]
    paths: [scripts/apply-data-center-v2-cutover.mjs]
permissions:
  contents: write
jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: phase6/data-center-v2-cutover
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: node scripts/apply-data-center-v2-cutover.mjs
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/admin/OperationsController.tsx app/ui/admin/data-center-v2/DataCenterV2App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(data-center-v2): make V2 the default data center"
          git push origin HEAD:phase6/data-center-v2-cutover
